<div class="section-title">📅 Upcoming Schedule</div>

<div class="empty-modal-state">
    <span class="icon">📭</span>
    <h4>No upcoming tests or tasks yet</h4>
    <p>Your schedule will appear here once tests are assigned to your batch.</p>
</div>

<div class="insight-box">
    <div style="display: flex; align-items: flex-start; gap: var(--space-3, 12px);">
        <span class="insight-icon">📌</span>
        <div>
            <div class="insight-title">Quick Tip</div>
            <div class="insight-text">Check with your faculty for upcoming test schedules.</div>
        </div>
    </div>
</div>

<div class="action-group">
    <button class="action-btn" onclick="window.modalSystem.close(); window.showToast('📅 Opening full calendar...')">📅 View Full Calendar</button>
    <button class="action-btn secondary" onclick="window.modalSystem.close(); window.showToast('🔔 Setting reminders...')">🔔 Set Reminders</button>
    <button class="action-btn secondary" onclick="window.modalSystem.close()">Close</button>
</div>
